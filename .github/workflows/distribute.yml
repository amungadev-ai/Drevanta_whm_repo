name: distribute

# Authorized distribution pipeline: takes a CI-green release from THIS
# (private) repository, re-verifies it, generates the channel bootstrap,
# signs the release and publishes it to the public distribution repository.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DIST_TOKEN                  GitHub token WITH PUSH ACCESS to
#                               amungadev-ai/drevanta-distribution
#                               (fine-grained, Contents: Read+Write on that
#                               repository only; short expiry recommended)
#   DREVANTA_DIST_SIGNING_KEY   the distribution signing key (PEM, private)
#   DREVANTA_DIST_PUBLIC_KEY    the matching public key (PEM)
#
# Governance: stable publication requires the exact owner authorization
# phrase. Development prereleases do not.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Private release tag to distribute (e.g. v1.0.0-owneraudit.1-dev.5)"
        required: true
      channel:
        description: "dev | stable"
        required: true
        default: "dev"
      dry_run:
        description: "Stage and verify only (no publication)"
        required: false
        default: "false"
      stable_authorization:
        description: "For channel=stable MUST be exactly: STABLE-RELEASE-AUTHORIZED:<tag>"
        required: false
        default: ""

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Governance gate (stable requires explicit owner authorization)
        run: |
          if [[ "${{ github.event.inputs.channel }}" == "stable" ]]; then
            [[ "${{ github.event.inputs.stable_authorization }}" == "STABLE-RELEASE-AUTHORIZED:${{ github.event.inputs.tag }}" ]] \
              || { echo "::error::stable publication refused — authorization phrase mismatch"; exit 1; }
          fi
          [[ "${{ github.event.inputs.channel }}" == "dev" || "${{ github.event.inputs.channel }}" == "stable" ]] \
            || { echo "::error::channel must be dev or stable"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Mandatory local verification gates (suite must be green)
        run: |
          go build ./... && go test ./internal/... -count=1
          bash scripts/build_install_package.sh
          bash scripts/verify_installer.sh

      - name: Stage secrets
        run: |
          mkdir -p /tmp/distkeys && chmod 700 /tmp/distkeys
          printf '%s\n' "${{ secrets.DREVANTA_DIST_SIGNING_KEY }}" > /tmp/distkeys/drevanta-dist-signing.pem
          printf '%s\n' "${{ secrets.DREVANTA_DIST_PUBLIC_KEY }}" > /tmp/distkeys/drevanta-dist-public.pem
          chmod 600 /tmp/distkeys/*.pem

      - name: Publish (or dry-run)
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
          DREVANTA_DIST_SIGNING_KEY: /tmp/distkeys/drevanta-dist-signing.pem
          DREVANTA_DIST_PUBLIC_KEY: /tmp/distkeys/drevanta-dist-public.pem
        run: |
          ARGS=(--tag "${{ github.event.inputs.tag }}" --channel "${{ github.event.inputs.channel }}")
          [[ "${{ github.event.inputs.channel }}" == "stable" ]] && \
            ARGS+=(--stable-authorization "${{ github.event.inputs.stable_authorization }}")
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
          bash scripts/publish_distribution.sh "${ARGS[@]}"
